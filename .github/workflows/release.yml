name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          staging="ride-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/ride" "$staging/"
          cp README.md "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive_ext == 'zip'
        shell: bash
        run: |
          staging="ride-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/ride.exe" "$staging/"
          cp README.md "$staging/"
          cd "$staging" && 7z a "../$staging.zip" . && cd ..
          echo "ASSET=$staging.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  build-macos:
    name: Build (macOS, both architectures)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build and package both macOS targets
        shell: bash
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target"
            staging="ride-${{ github.ref_name }}-$target"
            mkdir "$staging"
            cp "target/$target/release/ride" "$staging/"
            cp README.md "$staging/"
            tar czf "$staging.tar.gz" "$staging"
          done

      - name: Upload Apple Silicon artifact
        uses: actions/upload-artifact@v4
        with:
          name: ride-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
          path: ride-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

      - name: Upload Intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ride-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
          path: ride-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
